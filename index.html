<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Меню на неделю</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23EC2867' stroke-width='10'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#EC2867;--pink-d:#D41D5B;--pink-l:#FFE1EA;--pink-xl:#FFF4F7;
  --ink:#1D1D27;--muted:#8D8D99;--line:#EFEFF3;--bg:#E9E9EE;--card:#fff;
  --ok:#1E8E52;--ok-l:#E6F6EC;--warn:#B8700B;--warn-l:#FFF3DE;--bad:#CF2D4E;--bad-l:#FFE5EA;
  --shadow:0 8px 28px rgba(28,28,48,.07);--r:22px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font-family:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:#fff;position:relative;padding-bottom:120px;overflow:hidden}
@media (min-width:600px){body{padding:28px 0}.app{border-radius:38px;box-shadow:0 20px 60px rgba(28,28,48,.12);min-height:calc(100vh - 56px)}}
.deco{position:absolute;border-radius:50%;border:30px solid var(--pink-l);pointer-events:none;z-index:0}
.deco.a{width:190px;height:190px;top:-110px;right:-80px}
.deco.b{width:120px;height:120px;top:150px;left:-95px;border-width:22px;opacity:.6}
.top,.app main{position:relative;z-index:1}
.top{display:flex;align-items:center;gap:10px;padding:22px 22px 0}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--pink-l);display:grid;place-items:center;font-size:22px;flex:none}
.hello{font-weight:600;font-size:.95rem}
.syncpill{display:inline-block;font-size:.7rem;color:var(--muted);background:var(--pink-xl);padding:2px 9px;border-radius:99px;cursor:pointer;margin-top:1px}
.syncpill.err{color:var(--bad);background:var(--bad-l)}
.syncpill.on{color:var(--ok);background:var(--ok-l)}
.dots{margin-left:auto;width:42px;height:42px;border:0;background:none;cursor:pointer;color:#C9C9D2;display:grid;place-items:center;border-radius:14px}
.dots.active,.dots:hover{color:var(--pink);background:var(--pink-xl)}
h1,h2,h3{margin:0;font-weight:600}
h1.title{font-size:1.65rem;line-height:1.25;margin:16px 22px 18px;letter-spacing:-.01em}
h2{font-size:1.18rem;margin-bottom:12px}
h3{font-size:1rem}
.pad{padding:0 22px}
section{display:none}
section.active{display:block}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 12px}
.sechead h2{margin:0}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:16px;padding:12px 18px;font-size:.92rem;font-weight:500;cursor:pointer;box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 10px 24px rgba(236,40,103,.28)}
.btn.primary:hover{background:var(--pink-d)}
.btn.block{width:100%;padding:15px}
.btn.sm{padding:7px 12px;font-size:.8rem;border-radius:12px;box-shadow:none}
.btn.ghost{box-shadow:none;background:none}
.link{border:0;background:none;color:var(--pink);font-weight:600;cursor:pointer;padding:0;font-size:.88rem}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.sq{width:36px;height:36px;border-radius:12px;background:var(--pink);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 6px 14px rgba(236,40,103,.3)}
.sq svg{width:18px;height:18px}
.x{border:0;background:none;color:#C4C4CE;font-size:1.15rem;cursor:pointer;padding:2px 6px;line-height:1}
.x:hover{color:var(--bad)}
input[type=number],input[type=text],input[type=password],select{font-size:16px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--pink)}
input[type=number]{width:80px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid #DCDCE4;border-radius:8px;display:inline-grid;place-items:center;background:#fff;cursor:pointer;flex:none;margin:0;transition:.15s;vertical-align:middle}
input[type=checkbox]:checked{background:var(--pink);border-color:var(--pink)}
input[type=checkbox]:checked::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.field{display:flex;flex-direction:column;gap:5px;font-size:.85rem}
.field>span{color:var(--pink);font-weight:500;font-size:.8rem;padding-left:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 22px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:10px 16px;border-radius:18px;background:#fff;box-shadow:var(--shadow);border:1px solid var(--line);font-weight:500;font-size:.88rem;color:var(--ink);cursor:pointer;text-align:center;line-height:1.25}
.chip small{display:block;font-size:.7rem;color:var(--muted);font-weight:400}
.chip.active{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:0 8px 20px rgba(236,40,103,.3)}
.chip.active small{color:#ffd3e0}
.tog{display:inline-flex;align-items:center;gap:6px;padding:10px 15px;border-radius:16px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);cursor:pointer;font-weight:500;font-size:.88rem;user-select:none}
.tog input{display:none}
.tog:has(input:checked){background:var(--pink);color:#fff;border-color:var(--pink)}
.togs{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;padding:3px 9px;border-radius:99px;background:var(--pink-l);color:var(--pink);font-weight:600}
.tag.grey{background:#F2F2F5;color:var(--muted)}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{border-radius:16px;padding:9px 10px;font-size:.72rem;background:#F6F6F9;color:var(--muted);line-height:1.3}
.pill .goal{display:block;font-size:.66rem;opacity:.8}
.pill b{display:block;font-size:.9rem;color:var(--ink);font-weight:600}
.pill.ok{background:var(--ok-l)}.pill.ok b{color:var(--ok)}
.pill.warn{background:var(--warn-l)}.pill.warn b{color:var(--warn)}
.pill.bad{background:var(--bad-l)}.pill.bad b{color:var(--bad)}
/* меню */
.daypanel{display:none}
.daypanel.show{display:block}
.meal{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:14px 14px 10px;margin-bottom:16px}
.mtop{display:flex;gap:12px;align-items:center}
.emoji{width:60px;height:60px;border-radius:50%;background:var(--pink-xl);display:grid;place-items:center;font-size:30px;flex:none}
.mmain{flex:1;min-width:0}
.mlabel{color:var(--pink);font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.mname{font-weight:600;font-size:.98rem;line-height:1.3;margin:1px 0 2px}
.meta{font-size:.74rem;color:var(--muted)}
.mbottom{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.kc{font-weight:700;font-size:1.25rem}
.kc small{color:var(--muted);font-weight:500;font-size:.72rem}
.macro{font-size:.78rem;color:var(--muted)}
.macro b{color:var(--ink);font-weight:600}
.tip{background:var(--pink-xl);border-radius:14px;padding:9px 12px;font-size:.8rem;margin:8px 0 4px}
.items{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:4px}
.items td{padding:5px 2px;border-top:1px solid #F4F4F7;vertical-align:middle}
.items td:first-child{width:58%}
.items input{width:64px;padding:5px 8px;border-radius:10px;font-size:15px}
.num{text-align:right;white-space:nowrap;color:var(--muted);font-size:.76rem}
details summary{cursor:pointer;color:var(--pink);font-size:.82rem;font-weight:500;margin:6px 0 2px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'+ '}
details[open] summary::before{content:'– '}
details p{margin:.3rem 0 .4rem;font-size:.85rem;color:#4a4a57}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.addrow select{flex:1;min-width:150px}
.grid-days{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:14px;cursor:pointer;position:relative;text-align:left;font:inherit;color:inherit}
.dcard .emoji{width:100%;height:84px;border-radius:18px;font-size:40px;margin-bottom:10px}
.dcard .dn{font-weight:600;font-size:.95rem}
.dcard .meta{margin-bottom:6px}
.dcard .row2{display:flex;align-items:center;justify-content:space-between}
.dcard.today{border-color:var(--pink)}
.dcard .tr{position:absolute;top:10px;right:10px}
.cook{border-left:3px solid var(--pink-l);padding:2px 0 2px 12px;margin:0 0 16px}
.cook h3{font-size:.95rem}
.cook .ln{font-size:.84rem;margin:6px 0}
.cook .ln b{font-weight:600}
.cook .ing{color:var(--muted);font-size:.78rem}
.note{background:#F6F6F9;border-radius:14px;padding:10px 12px;font-size:.8rem;margin-top:8px;color:#4a4a57}
.empty{text-align:center;padding:26px 18px}
.hero{width:120px;height:120px;border-radius:50%;background:var(--pink);margin:4px auto 16px;display:grid;place-items:center;font-size:56px;box-shadow:0 14px 30px rgba(236,40,103,.3)}
/* покупки, дома */
.progress{height:8px;background:#F2F2F5;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.progress div{height:100%;background:var(--pink);border-radius:99px;transition:width .2s}
.grp{font-size:.78rem;font-weight:600;color:var(--pink);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 4px}
.row-i{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid #F4F4F7}
.row-i:last-child{border-bottom:0}
.row-i .nm{flex:1;font-size:.9rem}
.row-i.done .nm{text-decoration:line-through;color:var(--muted)}
.amt{white-space:nowrap;font-weight:600;font-size:.88rem}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:18px;padding:4px 8px 4px 16px;box-shadow:var(--shadow);background:#fff;margin-bottom:16px}
.search input{border:0;flex:1;padding:10px 0;min-width:0}
.search svg{width:18px;height:18px;color:#C4C4CE;flex:none}
/* добавки */
.supp-table{overflow-x:auto;margin:0 -4px}
.supp-table table{border-collapse:collapse;width:100%;min-width:330px}
.supp-table th,.supp-table td{padding:8px 2px;text-align:center;font-size:.82rem}
.supp-table th:first-child,.supp-table td:first-child{text-align:left;position:sticky;left:0;background:#fff;min-width:100px;padding-right:6px}
.supp-table th{font-weight:500;color:var(--muted);font-size:.72rem}
.supp-table th.today{color:var(--pink);font-weight:700}
.supp-table td.today input:not(:checked){border-color:var(--pink)}
.supp-table tr+tr td{border-top:1px solid #F4F4F7}
.ring{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ring .big{font-size:1.6rem;font-weight:700;color:var(--pink)}
.supp-edit{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #F4F4F7}
.supp-edit input,.supp-edit select{width:100%;min-width:0;padding:9px 10px}
.supp-edit>:nth-child(3){grid-column:1}.supp-edit>:nth-child(4){grid-column:2}.supp-edit>:nth-child(5){grid-column:3;grid-row:1}
.steps{margin:.4rem 0 .6rem 1.1rem;padding:0;font-size:.84rem}
.steps li{margin-bottom:5px}
code{background:var(--pink-xl);color:var(--pink-d);padding:2px 6px;border-radius:6px;font-size:.85em;word-break:break-all}
/* нижняя навигация */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:#fff;display:flex;justify-content:space-around;align-items:flex-end;padding:8px 8px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(28,28,48,.08);border-radius:28px 28px 0 0;z-index:10}
@media (min-width:600px){.bnav{bottom:28px;border-radius:28px;width:min(520px,100%)}}
.bnav button{border:0;background:none;color:#C4C4CE;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.64rem;font-weight:500;padding:4px 6px;cursor:pointer;min-width:56px}
.bnav button.active{color:var(--pink)}
.bnav svg{width:24px;height:24px}
.bnav .fab{width:64px;height:64px;border-radius:50%;background:var(--pink);color:#fff;margin-top:-36px;box-shadow:0 14px 28px rgba(236,40,103,.42);justify-content:center;min-width:64px;padding:0}
.bnav .fab svg{width:28px;height:28px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:16px;font-size:.86rem;transition:.25s;z-index:20;max-width:90vw;pointer-events:none}
#toast.show{transform:translateX(-50%);opacity:1}
@media print{
  body{background:#fff;padding:0}
  .app{box-shadow:none;border-radius:0;max-width:none;padding:0}
  .deco,.top,.bnav,.chips,.toolbar,.sq,.x,.noprint,#toast,details.add{display:none!important}
  .daypanel{display:block!important;break-inside:auto}
  .meal,.card{box-shadow:none;break-inside:avoid}
  .items input{border:0;width:40px;padding:0;text-align:right}
  h1.title{font-size:1.2rem;margin:0 0 10px}
  .pad{padding:0}
}
</style>
</head>

</nav>

/* ================== СОСТОЯНИЕ ================== */
function defaultState(){return{
  v:1,updatedAt:0,
  settings:{kcal:1700,protMin:110,protMax:120,fatPct:30,satPct:10,fiberMin:25,cookCount:3,trainDays:[0,2],
    meals:{b:true,l:true,d:true,s:true},extra:false,excluded:['мюсли','оливки','каперсы','хумус','суп']},
  home:{},custom:[],plan:null,bought:{},shopExtra:[],
  supps:[],suppWeek:{start:iso(mondayOf(new Date())),checks:{}},suppHistory:[]
}}
function migrate(s){
  const d=defaultState();
  const meals=Object.assign({},d.settings.meals,(s.settings||{}).meals||{});
  s.settings=Object.assign(d.settings,s.settings||{});s.settings.meals=meals;
  if(!Array.isArray(s.settings.trainDays))s.settings.trainDays=[];
  if(!Array.isArray(s.settings.excluded))s.settings.excluded=[];
  for(const k of ['home','bought'])if(!s[k]||typeof s[k]!=='object')s[k]={};
  for(const k of ['custom','supps','suppHistory','shopExtra'])if(!Array.isArray(s[k]))s[k]=[];
  if(!s.suppWeek||!s.suppWeek.start)s.suppWeek=d.suppWeek;
  if(!s.suppWeek.checks)s.suppWeek.checks={};
  s.v=1;return s;
}
function loadState(){try{const s=JSON.parse(localStorage.getItem(LS_KEY));if(s&&s.v)return migrate(s)}catch(e){}return defaultState()}
let state=loadState();
function persistLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){toast('Не удалось сохранить в браузере')}}
function save(){state.updatedAt=Date.now();persistLocal();schedulePush()}

function allProducts(){return BASE_PRODUCTS.concat(state.custom)}
let PMAP={};

rebuildPMap();
function prod(id){return PMAP[id]||{id,name:'(удалённый продукт)',dept:0,kcal:0,p:0,f:0,c:0,sat:0,fib:0}}
function macros(items){const t=zeroT();for(const it of items){const p=prod(it.p),k=(+it.g||0)/100;t.kcal+=p.kcal*k;t.p+=p.p*k;t.f+=p.f*k;t.c+=p.c*k;t.sat+=p.sat*k;t.fib+=p.fib*k}return t}
function addT(a,b,k=1){for(const key in a)a[key]+=b[key]*k;return a}
function zeroT(){return{kcal:0,p:0,f:0,c:0,sat:0,fib:0}}
const RM={};for(const r of RECIPES)RM[r.id]=macros(Object.entries(r.i).map(([p,g])=>({p,g})));

function targets(){const s=state.settings;const fat=s.kcal*s.fatPct/100/9;const pm=(s.protMin+s.protMax)/2;
  return{kcal:s.kcal,pMin:s.protMin,pMax:s.protMax,fat,carb:Math.max(0,(s.kcal-pm*4-fat*9)/4),satPct:s.satPct,fib:s.fiberMin}}

/* ================== ГОТОВКИ С УЧЁТОМ ТРЕНИРОВОК ==================
   Готовлю вечером на следующий день. Обычно вечер тренировки — без готовки.
   Если тренировки два (или больше) дня подряд, в один из этих вечеров можно доготовить. */
function cookOptions(train){
  const free=[],runs=[];let cur=[];
  for(let s=1;s<=4;s++){const e=s-1;
    if(!train.includes(e)){free.push(s);if(cur.length>=2)runs.push(cur);cur=[]}
    else cur.push(s)}
  if(cur.length>=2)runs.push(cur);
  return{free,runs};
}
function maxCooks(train){const o=cookOptions(train);return 1+o.free.length+o.runs.length}
function sessionsFor(k,train){
  const o=cookOptions(train),cand=[...o.free,...o.runs.flat()].sort((a,b)=>a-b);
  k=clamp(Math.round(k)||1,1,maxCooks(train));
  let best=[0],bk=null;
  for(let mask=0;mask<(1<<cand.length);mask++){
    const pk=cand.filter((_,j)=>mask>>j&1);if(pk.length!==k-1)continue;
    if(o.runs.some(r=>r.filter(x=>pk.includes(x)).length>1))continue;
    const tu=pk.filter(x=>!o.free.includes(x)).length,starts=[0,...pk];
    const lens=starts.map((st,j)=>(starts[j+1]??5)-st);
    const key=[Math.max(...lens),tu,lens.reduce((a,l)=>a+l*l,0)];
    if(!bk||key[0]<bk[0]||(key[0]===bk[0]&&(key[1]<bk[1]||(key[1]===bk[1]&&key[2]<bk[2])))){bk=key;best=starts}
  }
  return best.map((st,j)=>[0,1,2,3,4].slice(st,best[j+1]??5));
}
function sessionWhen(s,train){const f=s.days[0];if(f===0)return'в воскресенье вечером';return `в ${DAY_ACC[f-1]} вечером`+((train||[]).includes(f-1)?' (после тренировки)':'')}
function sessionWhenShort(s){const f=s.days[0];return f===0?'в вс':`в ${DAY_SHORT[f-1].toLowerCase()}`}

/* ================== СОСТАВЛЕНИЕ МЕНЮ ================== */
function isExcluded(r){
  const ex=state.settings.excluded.map(x=>x.trim().toLowerCase()).filter(Boolean);
  if(!ex.length)return false;
  const names=[r.n.toLowerCase(),...Object.keys(r.i).map(id=>prod(id).name.toLowerCase())];
  return ex.some(w=>names.some(n=>n.includes(w)));
}
function pools(){const ok=RECIPES.filter(r=>!isExcluded(r)&&!r.fresh&&(!r.x||state.settings.extra));
  const by=t=>ok.filter(r=>r.t===t).map(r=>r.id);
  return{b:by('b'),m:by('m'),q:by('q'),s:by('s'),pw:ok.filter(r=>r.t==='s'&&r.pw).map(r=>r.id)}}
function snackPool(P,isT){return isT&&P.pw.length?P.pw:P.s}
function scoreTotals(t,T,train,dinnerP){
  let sc=Math.abs(t.kcal-T.kcal)/T.kcal*300;
  if(t.p<T.pMin)sc+=(T.pMin-t.p)*2.5;else if(t.p>T.pMax+5)sc+=(t.p-T.pMax-5)*1.2;
  sc+=Math.abs(t.f-T.fat)*0.8;
  const satP=t.sat*9/Math.max(1,t.kcal)*100;if(satP>T.satPct)sc+=(satP-T.satPct)*6;
  if(t.fib<T.fib)sc+=(T.fib-t.fib)*1.2;
  if(train&&dinnerP!=null&&dinnerP<30)sc+=(30-dinnerP);
  return sc;
}
function homeHits(rid){let n=0;for(const p in RID[rid].i)if(state.home[p]&&state.home[p].has)n++;return n}
/* в день тренировки ужин — либо быстрый (q), либо разогреть блюдо из готовки */
function dayRids(c,i,sessions,train){const si=sessions.findIndex(s=>s.includes(i));
  return{b:c.days[i].b,l:c.sess[si].l,d:(train.includes(i)&&c.days[i].q)?c.days[i].q:c.sess[si].d,s:c.days[i].s}}
function scoreDayRids(rids,i,T,train){
  const base=zeroT();const keys=Object.keys(rids).filter(k=>rids[k]);
  for(const k of keys)addT(base,RM[rids[k]]);
  const f=clamp(T.kcal/Math.max(1,base.kcal),0.65,1.6);
  return scoreTotals(addT(zeroT(),base,f),T,train.includes(i),rids.d?RM[rids.d].p*f:null);
}
function scoreCand(c,sessions,T,train){
  let sc=0;for(let i=0;i<5;i++)sc+=scoreDayRids(dayRids(c,i,sessions,train),i,T,train);
  const used=[];c.sess.forEach(s=>{s.l&&used.push(s.l);s.d&&used.push(s.d)});c.days.forEach((d,i)=>{d.b&&used.push(d.b);d.s&&used.push(d.s);d.q&&train.includes(i)&&used.push(d.q)});
  for(const r of used)sc-=homeHits(r)*1.5;
  return sc;
}
function randCand(P,sessions,en,train){
  const mains=shuffle(P.m.slice());let mi=0;const next=()=>mains[(mi++)%mains.length];
  const sess=sessions.map(()=>({l:en.l?next():null,d:en.d?next():null}));
  const days=[];let lastQ=null;
  for(let i=0;i<5;i++){const pv=days[i-1]||{},isT=train.includes(i);let q=null;
    if(en.d&&isT&&P.q.length&&Math.random()<0.6){q=pickNot(P.q,lastQ);lastQ=q}
    const sp=snackPool(P,isT);
    days.push({b:en.b&&P.b.length?pickNot(P.b,pv.b):null,s:en.s&&sp.length?pickNot(sp,pv.s):null,q})}
  return{sess,days};
}
function scaleItems(map,f){return Object.entries(map).map(([p,g])=>({p,g:roundG(g*f)}))}
function buildDay(rids,T){
  const keys=Object.keys(rids).filter(k=>rids[k]);let kc=0;keys.forEach(k=>kc+=RM[rids[k]].kcal);
  const f=clamp(T.kcal/Math.max(1,kc),0.65,1.6);const meals={};
  for(const [k] of MEALS)if(rids[k])meals[k]={rid:rids[k],items:scaleItems(RID[rids[k]].i,f)};
  return{meals};
}
function generatePlan(){
  const s=state.settings,T=targets(),P=pools(),en=s.meals,train=s.trainDays.slice().sort();
  if(!(en.b||en.l||en.d||en.s)){toast('Включите хотя бы один приём пищи в настройках');return false}
  if((en.l||en.d)&&P.m.length<2){toast('Слишком много исключений — не хватает основных блюд');return false}
  if(en.b&&!P.b.length){toast('Нет подходящих завтраков — проверьте исключения');return false}
  if(en.s&&!P.s.length){toast('Нет подходящих перекусов — проверьте исключения');return false}
  const sessions=sessionsFor(s.cookCount,train);
  let best=null,bs=Infinity;
  for(let it=0;it<2500;it++){const c=randCand(P,sessions,en,train);const sc=scoreCand(c,sessions,T,train);if(sc<bs){bs=sc;best=c}}
  const opts=(i,k)=>k==='q'?(en.d&&train.includes(i)?[null,...P.q]:[]):(k==='s'?(best.days[i].s?snackPool(P,train.includes(i)):[]):(best.days[i].b?P.b:[]));
  for(let i=0;i<5;i++)for(const k of ['b','s','q']){
    for(const r of opts(i,k)){if(k!=='q'&&((i>0&&best.days[i-1][k]===r)||(i<4&&best.days[i+1][k]===r)))continue;
      const old=best.days[i][k];if(old===r)continue;best.days[i][k]=r;const sc=scoreCand(best,sessions,T,train);if(sc<bs-0.5)bs=sc;else best.days[i][k]=old}}
  const t=new Date();const ws=mondayOf(t);if((t.getDay()+6)%7>=5)ws.setDate(ws.getDate()+7);
  state.plan={weekStart:iso(ws),createdAt:Date.now(),trainDays:train,
    sessions:sessions.map((d,si)=>({days:d,l:best.sess[si].l,d:best.sess[si].d})),
    days:[0,1,2,3,4].map(i=>buildDay(dayRids(best,i,sessions,train),T))};
  state.bought={};
  return true;
}
function planTrain(){return (state.plan&&state.plan.trainDays)||[]}
function swapMeal(i,k){
  const p=state.plan,T=targets(),P=pools(),train=planTrain();
  const scoreWith=(day,di,rid)=>{const other=zeroT();for(const kk in day.meals)if(kk!==k)addT(other,macros(day.meals[kk].items));
    const f=clamp((T.kcal-other.kcal)/Math.max(1,RM[rid].kcal),0.5,1.8);const t=addT(addT(zeroT(),other),RM[rid],f);
    const dinP=k==='d'?RM[rid].p*f:(day.meals.d?macros(day.meals.d.items).p:null);
    return{sc:scoreTotals(t,T,train.includes(di),dinP)-homeHits(rid)*1.5,f}};
  const ses=p.sessions.find(s=>s.days.includes(i)),isT=train.includes(i),cur=p.days[i].meals[k].rid;
  const perDay=k==='b'||k==='s'||(k==='d'&&isT);
  if(perDay){
    let pool=k==='d'?P.q.concat(ses&&ses.d?[ses.d]:[]):(k==='s'?snackPool(P,isT):P[k]);
    if(k==='s'&&pool.length<2)pool=P.s;
    const cands=[...new Set(pool)].filter(r=>r!==cur);if(!cands.length){toast('Нет других вариантов');return}
    const scored=cands.map(r=>({r,...scoreWith(p.days[i],i,r)})).sort((a,b)=>a.sc-b.sc);
    const ch=pick(scored.slice(0,3));p.days[i].meals[k]={rid:ch.r,items:scaleItems(RID[ch.r].i,ch.f)};
  }else{
    const days=ses.days.filter(di=>p.days[di].meals[k]&&p.days[di].meals[k].rid===ses[k]);
    const used=new Set();p.sessions.forEach(s=>{s.l&&used.add(s.l);s.d&&used.add(s.d)});
    let cands=P.m.filter(r=>!used.has(r));if(!cands.length)cands=P.m.filter(r=>r!==ses[k]);if(!cands.length){toast('Нет других вариантов');return}
    const scored=cands.map(r=>({r,sc:days.reduce((a,di)=>a+scoreWith(p.days[di],di,r).sc,0)})).sort((a,b)=>a.sc-b.sc);
    const ch=pick(scored.slice(0,3));ses[k]=ch.r;
    for(const di of days){const {f}=scoreWith(p.days[di],di,ch.r);p.days[di].meals[k]={rid:ch.r,items:scaleItems(RID[ch.r].i,f)}}
  }
}

function statusPills(t,T){
  const st=(ok,soft)=>ok?'ok':(soft?'warn':'bad');
  const satP=t.sat*9/Math.max(1,t.kcal)*100;
  const items=[
    ['Ккал',`${r0(t.kcal)} / ${T.kcal}`,st(Math.abs(t.kcal-T.kcal)/T.kcal<=0.05,Math.abs(t.kcal-T.kcal)/T.kcal<=0.1)],
    ['Белки',`${r0(t.p)} г`,st(t.p>=T.pMin-3&&t.p<=T.pMax+10,t.p>=T.pMin-12),`${T.pMin}–${T.pMax}`],
    ['Жиры',`${r0(t.f)} г`,st(Math.abs(t.f-T.fat)/T.fat<=0.15,Math.abs(t.f-T.fat)/T.fat<=0.3),`~${r0(T.fat)}`],
    ['Углеводы',`${r0(t.c)} г`,st(Math.abs(t.c-T.carb)/Math.max(1,T.carb)<=0.2,true),`~${r0(T.carb)}`],
    ['Насыщ. жиры',`${r1(t.sat)} г · ${r1(satP)}%`,st(satP<=T.satPct,satP<=T.satPct+2),`≤${T.satPct}%`],
    ['Клетчатка',`${r0(t.fib)} г`,st(t.fib>=T.fib,t.fib>=T.fib-5),`≥${T.fib}`],
  ];
  return `<div class="pills">${items.map(([n,v,c,g])=>`<div class="pill ${c}">${n}<b>${v}</b>${g?`<span class="goal">цель ${g}</span>`:''}</div>`).join('')}</div>`;
}

function fmtAmount(pid,g,plain){const p=prod(pid);
  const gg=g>=50?Math.ceil(g/10)*10:Math.ceil(g/5)*5;
  let s=gg>=1000?`${(gg/1000).toFixed(gg%1000?1:0).replace('.',',')} кг`:`${gg} г`;
  if(p.pc)return `${Math.ceil(g/p.pc)} шт`;
  if(p.can)s+=plain?` (≈ ${Math.ceil(g/p.can)} × ${p.can} г)`:`<br><span class="muted small" style="font-weight:400">≈ ${Math.ceil(g/p.can)} × ${p.can} г</span>`;
  return s;
}
function shoppingData(){const p=state.plan;if(!p)return null;const need={};
  p.days.forEach(d=>Object.values(d.meals).forEach(m=>m.items.forEach(it=>need[it.p]=(need[it.p]||0)+(+it.g||0))));
  const buy=[],have=[];
  for(const [pid,g] of Object.entries(need)){if(g<=0)continue;const h=state.home[pid];
    if(h&&h.has){const q=+h.q||0;if(!q){have.push({pid,g,note:'есть дома'});continue}
      if(g-q<=0){have.push({pid,g,note:`хватит — дома ${q} г, нужно ${r0(g)} г`});continue}
      buy.push({pid,g:g-q,note:`всего ${r0(g)} г, дома ${q} г`})}
    else buy.push({pid,g})}
  const sortF=(a,b)=>prod(a.pid).name.localeCompare(prod(b.pid).name,'ru');
  buy.sort(sortF);have.sort(sortF);
  return{buy,have};
}

function checkWeek(){const cur=iso(mondayOf(new Date()));

function archiveWeek(){const w=state.suppWeek;const any=Object.values(w.checks||{}).some(o=>Object.values(o).some(Boolean));

/* ================== СИНХРОНИЗАЦИЯ ==================
   Два способа: личный код (Firebase, без регистрации для пользователя) или GitHub Gist (с токеном).
   Данные по коду лежат в документе menus/<SHA-256 от кода>: сам код в облако не передаётся. */
const FIREBASE={projectId:'menu-sync-7cd0c',apiKey:'AIzaSyBkzqz0DFmvbz0xC1Orvc4N4QwlReki2JU'};
function fbReady(){return !!(FIREBASE.projectId&&FIREBASE.apiKey)}
let sync=(()=>{try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{}}catch(e){return{}}})();
if(sync.token&&!sync.mode)sync.mode='gist';
function saveSync(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(sync))}catch(e){}}
let pushTimer=null,lastSync='';
function syncOn(){return sync.mode==='code'?!!(sync.docId&&fbReady()):!!(sync.token&&sync.gistId)}
function setSync(t,err){lastSync=t;const e=$('#syncStatus');e.textContent=t;e.classList.toggle('err',!!err);e.classList.toggle('on',!err&&syncOn())}
const CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(){const r=crypto.getRandomValues(new Uint8Array(16));let s='';r.forEach((x,i)=>{s+=CODE_ABC[x%32];if(i%4===3&&i<15)s+='-'});return s}
function normCode(c){const t=String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return t.length===16?t.match(/.{4}/g).join('-'):null}
async function sha256hex(str){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function codeDocId(code){return sha256hex('menu-sync:'+normCode(code))}
function fbUrl(id){return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(FIREBASE.projectId)}/databases/(default)/documents/menus/${id}?key=${encodeURIComponent(FIREBASE.apiKey)}`}
function remoteReq(method,body,cfg=sync){
  if(cfg.mode==='code')return{url:fbUrl(cfg.docId),opt:{method,headers:body?{'Content-Type':'application/json'}:{},body}};
  return{url:'https://api.github.com/gists/'+cfg.gistId,opt:{method,headers:Object.assign({'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'},body?{'Content-Type':'application/json'}:{}),body}};
}
function payload(cfg=sync){const json=JSON.stringify(state);
  return cfg.mode==='code'?JSON.stringify({fields:{data:{stringValue:json},updatedAt:{integerValue:String(state.updatedAt||0)}}}):JSON.stringify({files:{[GIST_FILE]:{content:json}}})}
function httpErr(r){const e=new Error('HTTP '+r.status);e.status=r.status;return e}
async function remoteGet(cfg=sync){
  const {url,opt}=remoteReq('GET',undefined,cfg);const r=await fetch(url,Object.assign(opt,{cache:'no-store'}));
  if(cfg.mode==='code'){if(r.status===404)return null;if(!r.ok)throw httpErr(r);const j=await r.json();const v=j.fields&&j.fields.data&&j.fields.data.stringValue;return v?JSON.parse(v):null}
  if(!r.ok)throw httpErr(r);const j=await r.json();const f=j.files&&j.files[GIST_FILE];if(!f)return null;
  let txt=f.content;if(f.truncated)txt=await (await fetch(f.raw_url)).text();return JSON.parse(txt);
}
async function remotePut(cfg=sync){const {url,opt}=remoteReq('PATCH',payload(cfg),cfg);const r=await fetch(url,opt);if(!r.ok)throw httpErr(r)}
function errText(e){if(sync.mode==='gist'&&e.status===401)return'⚠ неверный токен';if(e.status===400)return'⚠ ошибка настройки облака';if(e.status===403||e.status===401)return'⚠ нет доступа к облаку';if(e.status===404)return'⚠ хранилище не найдено';return'⚠ нет связи с облаком'}
async function pull(force){
  if(!syncOn())return;setSync('⟳ загрузка…');
  try{const remote=await remoteGet();
    if(remote&&remote.v&&(force||(remote.updatedAt||0)>(state.updatedAt||0))){state=migrate(remote);activeDay=null;rebuildPMap();buildOptions();persistLocal();if(checkWeek())save();renderAll()}
    else if(!remote||(state.updatedAt||0)>(remote.updatedAt||0))schedulePush(0);
    setSync('☁ синхронизировано '+hhmm());
  }catch(e){setSync(errText(e),true)}
}
function schedulePush(delay=1500){if(!syncOn())return;clearTimeout(pushTimer);setSync('⟳ сохраняю…');pushTimer=setTimeout(push,delay)}
async function push(){pushTimer=null;try{await remotePut();setSync('☁ сохранено '+hhmm())}catch(e){setSync(errText(e),true)}}
window.addEventListener('pagehide',()=>{if(pushTimer&&syncOn()){clearTimeout(pushTimer);pushTimer=null;try{const {url,opt}=remoteReq('PATCH',payload());fetch(url,Object.assign(opt,{keepalive:true}))}catch(e){}}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(checkWeek()){save();renderAll()}if(syncOn()&&!pushTimer)pull()}});
function pageUrl(){return location.origin+location.pathname}
function deviceLink(){return pageUrl()+'#sync='+sync.code}
async function connectCode(code,{create}={}){
  const c=normCode(code);if(!c){toast('Код должен состоять из 16 букв и цифр');return false}
  const cfg={mode:'code',code:c,docId:await codeDocId(c)};
  setSync('⟳ подключаю…');
  try{
    if(create){state.updatedAt=state.updatedAt||Date.now();persistLocal();await remotePut(cfg)}
    else{const remote=await remoteGet(cfg);
      if(!remote){setSync(syncOn()?lastSync:'только на этом устройстве');toast('Такого кода нет — проверьте, нет ли опечатки');return false}
      if(!confirm('Загрузить данные по этому коду? Данные на этом устройстве будут заменены.')){setSync(syncOn()?lastSync:'только на этом устройстве');return false}
      clearTimeout(pushTimer);pushTimer=null;
      sync=cfg;saveSync();state=migrate(remote);activeDay=null;rebuildPMap();buildOptions();persistLocal();if(checkWeek())save();renderAll();setSync('☁ синхронизировано '+hhmm());return true}
    sync=cfg;saveSync();setSync('☁ сохранено '+hhmm());renderSettings();return true;
  }catch(e){setSync('только на этом устройстве');toast(e.status===400?'Ошибка настройки облака (ключ)':e.status===403?'Облако отказало в доступе — проверьте правила Firestore':'Нет связи с облаком, попробуйте позже');return false}
}

function setTab(t){document.querySelectorAll('#bnav button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('#gear').classList.toggle('active',t==='settings');
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+t));try{localStorage.setItem(TAB_KEY,t)}catch(e){}}
document.getElementById('bnav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b){setTab(b.dataset.tab);window.scrollTo(0,0)}});

const ACT={
  tab:b=>{setTab(b.dataset.tab);window.scrollTo(0,0)},
  day:b=>{activeDay=b.dataset.d==='w'?'w':+b.dataset.d;renderMenu();const c=$('#tab-menu .chips');if(c&&c.getBoundingClientRect().top<0)window.scrollTo({top:c.offsetTop-10,behavior:'smooth'});
    const a=$('#tab-menu .chip.active');if(a)a.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})},
  gen:()=>{if(state.plan&&!confirm('Составить меню заново? Текущее меню и ручные правки будут заменены.'))return;if(generatePlan()){activeDay=null;save();renderAll();setTab('menu');window.scrollTo(0,0);toast('Меню составлено ✨')}},
  print:()=>window.print(),
  swap:b=>{swapMeal(+b.dataset.day,b.dataset.meal);save();renderMenu();renderShop()},
  rmitem:b=>{const m=state.plan.days[+b.dataset.day].meals[b.dataset.meal];m.items.splice(+b.dataset.idx,1);save();renderMenu();renderShop()},
  additem:b=>{const box=b.closest('.add');const pid=box.querySelector('select').value;const g=num(box.querySelector('input').value,0);if(!g){toast('Укажите граммы');return}
    const m=state.plan.days[+b.dataset.day].meals[b.dataset.meal];const ex=m.items.find(x=>x.p===pid);if(ex)ex.g+=g;else m.items.push({p:pid,g});save();renderMenu();renderShop()},
  copyshop:()=>{const t=shopText();if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast('Список скопирован'),()=>fallbackCopy(t));else fallbackCopy(t)},
  unbuy:()=>{state.bought={};save();renderShop()},
  xadd:()=>{const n=$('#xs_name').value.trim();if(!n){toast('Введите продукт');return}state.shopExtra.push({id:'x'+Date.now().toString(36),name:n,qty:$('#xs_qty').value.trim(),done:false});save();renderShop();setTimeout(()=>{const f=$('#xs_name');if(f)f.focus()},0)},
  xdel:b=>{state.shopExtra=state.shopExtra.filter(x=>x.id!==b.dataset.id);save();renderShop()},
  xclear:()=>{state.shopExtra=state.shopExtra.filter(x=>!x.done);save();renderShop()},
  clearhome:()=>{if(!confirm('Снять все отметки «есть дома»?'))return;state.home={};save();renderHome();renderShop()},
  addcustom:()=>{const name=$('#cp_name').value.trim();if(!name){toast('Введите название');return}
    const p={id:'c'+Date.now().toString(36),name,dept:+$('#cp_dept').value,custom:true};for(const k of ['kcal','p','f','c','sat','fib'])p[k]=num($('#cp_'+k).value,0);
    state.custom.push(p);rebuildPMap();buildOptions();save();renderHome();toast('Продукт добавлен')},
  delcustom:b=>{if(!confirm('Удалить этот продукт?'))return;state.custom=state.custom.filter(p=>p.id!==b.dataset.pid);delete state.home[b.dataset.pid];rebuildPMap();buildOptions();save();renderAll()},
  addsupp:()=>{const name=$('#ns_name').value.trim();if(!name){toast('Введите название');return}
    state.supps.push({id:'s'+Date.now().toString(36),name,dose:$('#ns_dose').value.trim(),time:$('#ns_time').value,food:$('#ns_food').value});save();renderSupps()},
  delsupp:b=>{const s=state.supps.find(x=>x.id===b.dataset.id);if(!confirm(`Удалить «${s?s.name:''}»?`))return;state.supps=state.supps.filter(x=>x.id!==b.dataset.id);delete state.suppWeek.checks[b.dataset.id];save();renderSupps()},
  newweek:()=>{if(!confirm('Начать новую неделю? Текущие отметки уйдут в историю.'))return;archiveWeek();state.suppWeek={start:iso(mondayOf(new Date())),checks:{}};save();renderSupps()},
  addex:()=>{const v=$('#exInput').value.trim().toLowerCase();if(!v)return;if(!state.settings.excluded.includes(v))state.settings.excluded.push(v);save();renderSettings()},
  delex:b=>{state.settings.excluded.splice(+b.dataset.i,1);save();renderSettings()},
  export:()=>{const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='menu-backup-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)},
  reset:()=>{if(!confirm('Удалить все данные на этом устройстве? (Облачная копия, если подключена, тоже будет перезаписана.)'))return;state=defaultState();activeDay=null;rebuildPMap();buildOptions();save();renderAll()},
  syncon:async()=>{const token=$('#syncToken').value.trim(),gid=$('#syncGist').value.trim();if(!token){toast('Вставьте токен');return}
    const cfg={mode:'gist',token,gistId:''};
    try{if(gid){cfg.gistId=gid.replace(/^.*\//,'');setSync('⟳ загрузка…');const remote=await remoteGet(cfg);
        if(!confirm('Загрузить данные из облака? Данные на этом устройстве будут заменены.')){setSync('только на этом устройстве');return}
        sync=cfg;saveSync();if(remote){state=migrate(remote);activeDay=null;rebuildPMap();buildOptions();persistLocal();if(checkWeek())save()}else save();renderAll();setSync('☁ синхронизировано '+hhmm())}
      else{setSync('⟳ создаю хранилище…');state.updatedAt=state.updatedAt||Date.now();persistLocal();
        const r=await fetch('https://api.github.com/gists',{method:'POST',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({description:'Меню на неделю — данные приложения',public:false,files:{[GIST_FILE]:{content:JSON.stringify(state)}}})});
        if(!r.ok)throw httpErr(r);const g=await r.json();cfg.gistId=g.id;sync=cfg;saveSync();setSync('☁ сохранено '+hhmm())}
      renderSettings();toast('Синхронизация включена')}
    catch(e){setSync(syncOn()?lastSync:'только на этом устройстве');toast(e.status===401?'Неверный токен':'Не удалось подключиться')}},
  newcode:async()=>{const code=genCode();if(await connectCode(code,{create:true})){sync.showCode=true;saveSync();renderSettings();toast('Код создан — сохраните его')}},
  usecode:async()=>{const v=$('#codeInput').value;await connectCode(v)&&toast('Синхронизация включена')},
  tocode:async()=>{if(!confirm('Перейти на личный код? Текущие данные будут перенесены, GitHub на этом устройстве отключится.'))return;
    const code=genCode();if(await connectCode(code,{create:true})){sync.showCode=true;saveSync();renderSettings();toast('Готово — введите этот код на других устройствах')}},
  togglecode:()=>{sync.showCode=!sync.showCode;saveSync();renderSettings()},
  syncnow:()=>{if(pushTimer){clearTimeout(pushTimer);push()}else pull()},
  syncoff:()=>{if(!confirm('Отключить синхронизацию на этом устройстве? Данные останутся и здесь, и в облаке.'))return;sync={};saveSync();renderSettings();setSync('только на этом устройстве')},
  copytxt:b=>copyText(b.dataset.t),
};
function copyText(t){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast('Скопировано'),()=>fallbackCopy(t));else fallbackCopy(t)}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Скопировано')}catch(e){toast('Не удалось скопировать')}ta.remove()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e)}});

document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='importFile'){const file=el.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!s||!s.v)throw 0;
      if(!confirm('Заменить текущие данные данными из файла?'))return;state=migrate(s);activeDay=null;rebuildPMap();buildOptions();checkWeek();save();renderAll();toast('Данные загружены')}catch(err){toast('Файл не подходит')}};rd.readAsText(file);return}
  const ch=el.dataset.ch;if(!ch)return;
  const s=state.settings;
  switch(ch){
    case 'grams':{const m=state.plan.days[+el.dataset.day].meals[el.dataset.meal];m.items[+el.dataset.idx].g=Math.max(0,Math.round(num(el.value,0)));save();renderMenu();renderShop();break}
    case 'bought':{if(el.checked)state.bought[el.dataset.pid]=true;else delete state.bought[el.dataset.pid];save();renderShop();break}
    case 'homehas':{const pid=el.dataset.pid;if(el.checked){state.home[pid]=Object.assign(state.home[pid]||{},{has:true})}else{delete state.home[pid];const q=el.parentElement.querySelector('input[type=number]');if(q)q.value=''}save();renderShop();break}
    case 'homeq':{const v=Math.max(0,Math.round(num(el.value,0)));const h=state.home[el.dataset.pid]||{};h.q=v||'';if(v)h.has=true;state.home[el.dataset.pid]=h;save();const cb=el.parentElement.querySelector('input[type=checkbox]');if(cb)cb.checked=!!h.has;renderShop();break}
    case 'suppcheck':{const c=state.suppWeek.checks;c[el.dataset.id]=c[el.dataset.id]||{};c[el.dataset.id][el.dataset.d]=el.checked;save();renderSupps();break}
    case 'suppf':{const sp=state.supps.find(x=>x.id===el.dataset.id);if(sp){if(el.dataset.f==='name'&&!el.value.trim()){el.value=sp.name;break}sp[el.dataset.f]=el.value.trim();save();renderSupps()}break}
    case 'set':{const k=el.dataset.k;let v=num(el.value,s[k]);if(k==='cookCount')v=clamp(Math.round(v),1,5);if(k==='kcal')v=clamp(v,800,5000);
      s[k]=v;if(s.protMax<s.protMin)s.protMax=s.protMin;save();renderSettings();renderMenu();break}
    case 'train':{const d=+el.dataset.d;s.trainDays=s.trainDays.filter(x=>x!==d);if(el.checked)s.trainDays.push(d);s.trainDays.sort();
      const mx=maxCooks(s.trainDays);if(s.cookCount>mx)toast(`С такими тренировками — максимум ${mx} готовки в неделю`);save();renderSettings();break}
    case 'meal':{s.meals[el.dataset.k]=el.checked;save();break}
    case 'extra':{s.extra=el.checked;save();break}
    case 'xdone':{const it=state.shopExtra.find(x=>x.id===el.dataset.id);if(it){it.done=el.checked;save();renderShop()}break}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='homeSearch'){const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.home-row').forEach(r=>r.style.display=!q||r.dataset.name.includes(q)?'':'none');
  document.querySelectorAll('.home-group').forEach(g=>g.style.display=[...g.querySelectorAll('.home-row')].some(r=>r.style.display!=='none')?'':'none')}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='codeInput'){e.preventDefault();ACT.usecode()}if(e.target.id==='exInput'){e.preventDefault();ACT.addex()}if(e.target.id==='xs_name'||e.target.id==='xs_qty'){e.preventDefault();ACT.xadd()}});

/* ================== СТАРТ ================== */
buildOptions();
if(checkWeek())save();
// блюда, которые едят сразу (не для готовки впрок), заменяем в уже составленном меню
if(state.plan){let ch=false;state.plan.sessions.forEach(s=>['l','d'].forEach(k=>{if(s[k]&&RID[s[k]]&&RID[s[k]].fresh){const di=s.days.find(x=>state.plan.days[x].meals[k]&&state.plan.days[x].meals[k].rid===s[k]);if(di!=null){swapMeal(di,k);ch=true}}}));if(ch)save()}
let startTab='menu';try{startTab=localStorage.getItem(TAB_KEY)||'menu'}catch(e){}
setTab(['menu','shop','home','supps','settings'].includes(startTab)?startTab:'menu');
renderAll();
(async()=>{const m=location.hash.match(/^#sync=([A-Za-z0-9-]+)/);
  if(m){history.replaceState(null,'',location.pathname+location.search);
    if(!fbReady())toast('Синхронизация по коду ещё не настроена');
    else if(!(syncOn()&&sync.mode==='code'&&sync.code===normCode(m[1]))){setTab('settings');if(await connectCode(m[1]))toast('Синхронизация включена');return}}
  if(syncOn())pull();})();
</script>
</body>
</html>
